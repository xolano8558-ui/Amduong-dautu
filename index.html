<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triết Lý Đầu Tư Âm Dương - Phân Tích Chi Tiết</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-inner: #1f2937;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-yang: #3b82f6;
            --accent-yin: #ec4899;
            --accent-green: #00b894;
            --accent-red: #ef4444;
            --border-color: #374151;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 950px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; margin-bottom: 5px; color: #fff; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
        
        .control-box {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .input-row {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .input-row label { font-size: 13px; font-weight: bold; color: var(--text-muted); }
        .input-row input {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .upload-section {
            border: 2px dashed var(--border-color);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            background: var(--bg-color);
            margin-bottom: 12px;
        }
        .upload-section input[type="file"] { color: var(--text-muted); font-size: 13px; }
        .btn-ai {
            background: linear-gradient(135deg, #3b82f6, #ec4899);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            transition: 0.2s;
        }
        .btn-ai:hover { opacity: 0.9; transform: translateY(-1px); }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media(max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }
        .card {
            background: var(--card-inner);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
        }
        .card.yang { border-top: 4px solid var(--accent-yang); }
        .card.yin { border-top: 4px solid var(--accent-yin); }
        .card-title { font-size: 15px; font-weight: bold; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            cursor: pointer;
            line-height: 1.4;
        }
        .checklist-item input { width: 18px; height: 18px; accent-color: var(--accent-green); cursor: pointer; margin-top: 1px; }
        
        .summary-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            text-align: left;
        }
        .score-display { font-size: 15px; font-weight: bold; margin-top: 8px; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.03); line-height: 1.6; }
        
        .summary-list {
            margin-top: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            font-size: 13px;
        }
        @media(max-width: 768px) { .summary-list { grid-template-columns: 1fr; } }
        .summary-col { background: var(--card-inner); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .summary-col h4 { margin: 0 0 8px 0; font-size: 13px; text-transform: uppercase; }
        .summary-col ul { margin: 0; padding-left: 18px; line-height: 1.5; color: var(--text-muted); }

        .quote-box {
            background: rgba(245, 158, 11, 0.05);
            border: 1px dashed #f59e0b;
            border-radius: 10px;
            padding: 14px;
            margin-top: 20px;
            text-align: center;
            font-style: italic;
            color: #fcd34d;
            font-size: 13px;
            line-height: 1.5;
        }
        .btn-reset {
            margin-top: 15px;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .btn-reset:hover { border-color: #ff4d4d; color: #ff4d4d; }
    </style>
</head>
<body>

<div class="container">
    <h2>☯️ Hệ Thống Đánh Giá Cổ Phiếu Âm - Dương</h2>
    <div class="subtitle">AI Vision - Tự
